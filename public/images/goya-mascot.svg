<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" width="100%" height="100%" fill="none">
  <!-- Soft Shadow -->
  <ellipse cx="120" cy="165" rx="75" ry="8" fill="#E8DEC8" />

  <!-- Shopping Cart Wheels -->
  <circle cx="85" cy="155" r="12" fill="#1B365D" />
  <circle cx="85" cy="155" r="5" fill="#D1E030" />
  <circle cx="155" cy="155" r="12" fill="#1B365D" />
  <circle cx="155" cy="155" r="5" fill="#D1E030" />

  <!-- Shopping Cart Chassis -->
  <path d="M70 148 L170 148 M85 148 L95 125 M155 148 L145 125" stroke="#1B365D" stroke-width="4" stroke-linecap="round" />

  <!-- Shopping Cart Basket Wireframe -->
  <rect x="65" y="75" width="110" height="50" rx="8" fill="#F4EAD4" stroke="#1B365D" stroke-width="4" />
  <!-- Wire Grid lines -->
  <path d="M65 92 H175 M65 108 H175 M92 75 V125 M120 75 V125 M148 75 V125" stroke="#1B365D" stroke-width="2.5" stroke-linecap="round" opacity="0.4" />

  <!-- Cart Handle -->
  <path d="M65 85 L48 85 L42 105" stroke="#1B365D" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
  <rect x="42" y="80" width="8" height="10" rx="2" fill="#D1E030" stroke="#1B365D" stroke-width="2" />

  <!-- Mini Goya Bottle in Cart -->
  <g transform="translate(132, 60) rotate(15)">
    <!-- Bottle Body -->
    <rect x="0" y="14" width="22" height="42" rx="4" fill="#D4AF37" stroke="#1B365D" stroke-width="2.5" />
    <path d="M4 14 L8 4 L14 4 L18 14 Z" fill="#D4AF37" stroke="#1B365D" stroke-width="2" />
    <!-- Cap -->
    <rect x="7" y="0" width="8" height="5" rx="1.5" fill="#C59B27" stroke="#1B365D" stroke-width="1.5" />
    <!-- Spout -->
    <path d="M11 0 L11 -4" stroke="#D4AF37" stroke-width="2.5" stroke-linecap="round" />
    <!-- Label -->
    <rect x="2" y="24" width="18" height="22" rx="2" fill="#FFFFFF" stroke="#1B365D" stroke-width="1" />
    <rect x="4" y="26" width="14" height="6" rx="1" fill="#1B365D" />
    <text x="11" y="31" font-family="sans-serif" font-weight="900" font-size="5" fill="#FFFFFF" text-anchor="middle">GOYA</text>
  </g>

  <!-- Don Sixto Olive Character -->
  <g id="olive-mascot">
    <!-- Olive Leaf on head -->
    <path d="M112 38 C112 25 125 22 135 25 C125 32 120 40 112 38 Z" fill="#6B8E23" stroke="#1B365D" stroke-width="2" />

    <!-- Olive Body -->
    <ellipse cx="105" cy="72" rx="30" ry="36" fill="#8DA73B" stroke="#1B365D" stroke-width="4" />
    <!-- Olive Belly Highlight -->
    <ellipse cx="96" cy="65" rx="18" ry="24" fill="#A4C248" opacity="0.6" />

    <!-- Rosy Cheeks -->
    <ellipse cx="88" cy="78" rx="5" ry="3" fill="#E88470" opacity="0.6" />
    <ellipse cx="122" cy="78" rx="5" ry="3" fill="#E88470" opacity="0.6" />

    <!-- Cute Eyes -->
    <ellipse cx="94" cy="70" rx="3.5" ry="5" fill="#1B365D" />
    <circle cx="93" cy="68" r="1.5" fill="#FFFFFF" />
    <ellipse cx="116" cy="70" rx="3.5" ry="5" fill="#1B365D" />
    <circle cx="115" cy="68" r="1.5" fill="#FFFFFF" />

    <!-- Smiling Mouth -->
    <path d="M100 80 Q105 87 110 80" stroke="#1B365D" stroke-width="3" stroke-linecap="round" fill="none" />

    <!-- Don Sixto Top Hat -->
    <g transform="translate(85, 12) rotate(-8)">
      <!-- Hat Brim -->
      <ellipse cx="22" cy="28" rx="26" ry="6" fill="#1B365D" stroke="#1B365D" stroke-width="2" />
      <!-- Hat Crown -->
      <path d="M8 28 L11 6 L33 6 L36 28 Z" fill="#1B365D" stroke="#1B365D" stroke-width="2" stroke-linejoin="round" />
      <!-- Hat Ribbon (Gold) -->
      <path d="M9 25 L10 21 L34 21 L35 25 Z" fill="#D4AF37" />
    </g>

    <!-- Olive Little Hands holding the cart -->
    <circle cx="75" cy="85" r="5" fill="#8DA73B" stroke="#1B365D" stroke-width="2.5" />
    <circle cx="135" cy="85" r="5" fill="#8DA73B" stroke="#1B365D" stroke-width="2.5" />
  </g>

  <!-- Sparkles / Droplets -->
  <g fill="#D1E030" stroke="#1B365D" stroke-width="1.5">
    <!-- Star 1 -->
    <path d="M50 50 Q55 50 55 45 Q55 50 60 50 Q55 50 55 55 Q55 50 50 50 Z" />
    <!-- Star 2 -->
    <path d="M185 45 Q190 45 190 40 Q190 45 195 45 Q190 45 190 50 Q190 45 185 45 Z" />
    <!-- Floating Gold Droplet -->
    <path d="M180 85 C180 80 185 75 185 75 C185 75 190 80 190 85 C190 88 188 90 185 90 C182 90 180 88 180 85 Z" fill="#F5C438" />
  </g>
</svg>
